<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">상승 주가 프로필 이미지</title>
  <style>
    .ring-glint { transform-origin: 48px 48px; animation: ring-sweep 8s linear infinite; }
    .ring-sparkle { animation: ring-twinkle 3.6s ease-in-out infinite; }
    .ring-sparkle.second { animation-delay: -1.2s; }
    .ring-sparkle.third { animation-delay: -2.4s; }
    @keyframes ring-sweep { to { transform: rotate(360deg); } }
    @keyframes ring-twinkle {
      0%, 100% { opacity: .15; }
      45%, 55% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ring-glint, .ring-sparkle { animation: none; }
      .ring-sparkle { opacity: .7; }
    }
  </style>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16A895"/>
      <stop offset="0.52" stop-color="#C9343F"/>
      <stop offset="1" stop-color="#35AD8F"/>
    </linearGradient>
    <linearGradient id="profile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4F7F1"/>
      <stop offset="1" stop-color="#E1EEFF"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="47" fill="url(#ring)"/>
  <circle cx="48" cy="48" r="42" fill="url(#profile)" stroke="#FFFFFF" stroke-width="1.5"/>
  <path d="M20 68h56M20 54h56M20 40h56" stroke="#D7E7E7" stroke-width="1.5"/>
  <rect x="25" y="57" width="8" height="11" rx="2" fill="#75C9AF"/>
  <rect x="41" y="49" width="8" height="19" rx="2" fill="#4FB79B"/>
  <rect x="57" y="41" width="8" height="27" rx="2" fill="#E8797E"/>
  <path d="m23 55 17-8 12 5 21-22" fill="none" stroke="#C9343F" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <path d="m63 30 11-1-1 11" fill="none" stroke="#C9343F" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5"/>
  <circle class="ring-glint" cx="48" cy="48" r="44.5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="12 267.6" opacity=".75"/>
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width=".5" stroke-linejoin="round">
    <path class="ring-sparkle" d="M17 11 18 14 21 15 18 16 17 19 16 16 13 15 16 14Z"/>
    <path class="ring-sparkle second" d="M91 45 92 48 95 49 92 50 91 53 90 50 87 49 90 48Z"/>
    <path class="ring-sparkle third" d="M27 83 28 86 31 87 28 88 27 91 26 88 23 87 26 86Z"/>
  </g>
</svg>
